<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href="@{/css/bootstrap.min.css}" />

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games to review</title>
</head>

<body>

    <div class="col-md-4">
        <h1>Games</h1>
    </div>

    <div class="col-md-4">
        <h3>Welcome <span sec:authentication="name"></span></h3>
    </div>
    <div class="col-md-4" style="padding:20px 0">
        <form th:action="@{/logout}" method="post">
            <input type="submit" value="Sign Out" class="btn btn-sm btn-danger" />
        </form>
    </div>

    <table class="table table-striped">
        <tr>
            <th>Title</th>
            <th>Developer</th>
            <th>Price</th>
            <th>Publication Year</th>
            <th>Genre</th>
            <th sec:authorize="hasAuthority('ADMIN')"> </th>
        </tr>

        <tr th:each="game : ${games}">
            <td th:text="${game.title}">Title</td>
            <td th:text="${game.developer}">Developer</td>
            <td th:text="${game.publicationYear}">Year</td>
            <td th:text="${game.price}">Price</td>
            <td th:text="${game.genre.name}"></td>
            <td sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-danger"
                    th:href="@{/delete/{id}(id=${game.gameId})}">Delete Game</a></td>
            <td sec:authorize="hasAuthority('ADMIN')"><a th:href="@{/edit/{id}(id=${game.gameId})}">Edit Game</a></td>
        </tr>
    </table>
    <p sec:authorize="hasAuthority('ADMIN')"><a class="btn btn-success" th:href="@{/newgame}">Add Game</a></p>
    <p><a class="btn btn-success" th:href="@{/genrelist}">See genres</a></p>
</body>

</html>
